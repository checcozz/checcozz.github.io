		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>

			<script src="assets/js/main.js"></script>
			<script>
				// Funzione per ottenere i parametri dalla query string
				function getQueryParam(param) {
					const urlParams = new URLSearchParams(window.location.search);
					return urlParams.get(param);
				}
		
				// Dati dei progetti
				const projects = {
					"ai": {
						title1: "AI",
						title: "Artificial Intelligence",
						description: "Harvard CS50's Introduction to Artificial Intelligence with Python (edX Verified Certificate, January 2024). Through hands-on Python projects I implemented the core ideas behind modern AI: graph search algorithms, knowledge representation and logical inference, probability and uncertainty, optimization, machine learning, neural networks and natural language processing.",
						image: "images/AI.png"
					},
					"capm": {
						title1: "CAPM",
						title: "Project Management (CAPM)",
						description: "Completed CAPM certification for project management, with skills in managing teams, budgeting, and planning.",
						image: "images/CAPM.png"
					}
				};
		
				// Recupera il parametro "project" dall'URL
				const projectId = getQueryParam('project');
		
				// Se il progetto esiste, aggiorna il contenuto della pagina
				if (projectId && projects[projectId]) {
					document.getElementById('project-title1').innerText = projects[projectId].title1;
					document.getElementById('project-title').innerText = projects[projectId].title;
					document.getElementById('project-heading').innerText = projects[projectId].title;
					document.getElementById('project-description').innerText = projects[projectId].description;
					document.getElementById('project-image').src = projects[projectId].image;
				} else {
					// In caso di errore o progetto non trovato
					document.getElementById('project-title').innerText = "Project Not Found";
					document.getElementById('project-description').innerText = "We couldn't find the project you're looking for.";
				}
			</script>

	</body>
</html>
